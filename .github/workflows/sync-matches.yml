name: Sync Matches Cron

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Sync Endpoint
        run: curl -s 'https://foudefoot.vercel.app/api/cron/sync-matches'
